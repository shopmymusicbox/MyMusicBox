<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>CalorieSnap</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="prevDay" aria-label="Previous day">‹</button>
    <div class="day-label" id="dayLabel">Today</div>
    <button class="icon-btn" id="nextDay" aria-label="Next day">›</button>
    <button class="icon-btn settings-btn" id="openSettings" aria-label="Settings">⚙</button>
  </header>

  <main id="home">
    <section class="card budget">
      <div class="ring-wrap">
        <svg viewBox="0 0 120 120" class="ring" aria-hidden="true">
          <circle cx="60" cy="60" r="52" class="ring-track"/>
          <circle cx="60" cy="60" r="52" class="ring-fill" id="ringFill"/>
        </svg>
        <div class="ring-center">
          <div class="ring-num" id="remaining">0</div>
          <div class="ring-sub" id="remainingLabel">left</div>
        </div>
      </div>
      <div class="budget-stats">
        <div><span class="stat-num" id="goalNum">0</span><span class="stat-lbl">Goal</span></div>
        <div><span class="stat-num" id="eatenNum">0</span><span class="stat-lbl">Eaten</span></div>
      </div>
      <div class="macros" id="macros"></div>
    </section>

    <section class="actions">
      <label class="btn primary big">
        📷 Snap a meal
        <input type="file" accept="image/*" capture="environment" id="cameraInput" hidden>
      </label>
      <div class="action-row">
        <label class="btn">
          🖼 From photos
          <input type="file" accept="image/*" id="galleryInput" hidden>
        </label>
        <button class="btn" id="describeBtn">✏️ Describe it</button>
      </div>
    </section>

    <section class="card">
      <h2>Meals</h2>
      <div id="mealList" class="meal-list"></div>
    </section>

    <section class="card" id="recentsCard">
      <h2>Quick add</h2>
      <p class="muted small">Tap a recent meal to log it again.</p>
      <div id="recents" class="chips"></div>
    </section>

    <section class="card">
      <h2>Last 7 days</h2>
      <div id="weekChart" class="week-chart"></div>
    </section>
  </main>

  <!-- Describe / note sheet -->
  <dialog id="describeDialog" class="sheet">
    <form method="dialog" id="describeForm">
      <h2 id="describeTitle">Describe your meal</h2>
      <img id="describePreview" class="preview" alt="" hidden>
      <textarea id="describeText" rows="3" placeholder="e.g. 2 scrambled eggs in butter, 1 slice sourdough toast, black coffee"></textarea>
      <p class="muted small" id="describeHint">Details like amounts, brands, or cooking oil make estimates more accurate.</p>
      <div class="sheet-actions">
        <button class="btn" value="cancel" formnovalidate>Cancel</button>
        <button class="btn primary" value="ok" id="describeSubmit">Estimate</button>
      </div>
    </form>
  </dialog>

  <!-- Review sheet -->
  <dialog id="reviewDialog" class="sheet tall">
    <div id="reviewBody"></div>
  </dialog>

  <!-- Settings sheet -->
  <dialog id="settingsDialog" class="sheet tall">
    <form method="dialog" id="settingsForm">
      <h2>Daily goal</h2>
      <label class="field">Calories per day
        <input type="number" id="goalInput" min="800" max="6000" step="10" required>
      </label>
      <label class="field">Protein target (g, optional)
        <input type="number" id="proteinInput" min="0" max="400" step="1">
      </label>

      <details class="calc">
        <summary>Not sure? Calculate it for me</summary>
        <div class="grid2">
          <label class="field">Sex
            <select id="calcSex"><option value="female">Female</option><option value="male">Male</option></select>
          </label>
          <label class="field">Age
            <input type="number" id="calcAge" min="13" max="100" value="30">
          </label>
          <label class="field">Height
            <span class="inline"><input type="number" id="calcHeight" min="50" max="250" value="170"><select id="calcHeightUnit"><option value="cm">cm</option><option value="in">in</option></select></span>
          </label>
          <label class="field">Weight
            <span class="inline"><input type="number" id="calcWeight" min="25" max="350" value="70"><select id="calcWeightUnit"><option value="kg">kg</option><option value="lb">lb</option></select></span>
          </label>
        </div>
        <label class="field">Activity
          <select id="calcActivity">
            <option value="1.2">Sedentary (desk job, little exercise)</option>
            <option value="1.375" selected>Light (exercise 1–3 days/week)</option>
            <option value="1.55">Moderate (3–5 days/week)</option>
            <option value="1.725">Very active (6–7 days/week)</option>
          </select>
        </label>
        <label class="field">Goal
          <select id="calcGoal">
            <option value="-500">Lose ~0.5 kg / 1 lb per week</option>
            <option value="-250">Lose slowly</option>
            <option value="0" selected>Maintain weight</option>
            <option value="250">Gain slowly</option>
          </select>
        </label>
        <button type="button" class="btn" id="calcBtn">Calculate</button>
        <p class="muted small" id="calcResult"></p>
      </details>

      <div class="sheet-actions">
        <button class="btn" value="cancel" formnovalidate>Cancel</button>
        <button class="btn primary" value="ok">Save</button>
      </div>
      <hr>
      <button type="button" class="btn danger-text" id="exportBtn">Export my log (CSV)</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js" type="module"></script>
</body>
</html>
